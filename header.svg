<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Marcos Ferrándiz — Dev Jr. DAM + IA &amp; Big Data">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0713"/>
      <stop offset="0.55" stop-color="#2d0b3d"/>
      <stop offset="1" stop-color="#6d1b7b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4ecd" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff4ecd"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ff4ecd" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff4ecd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.8" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ff4ecd" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="240" fill="url(#bg)"/>
  <rect width="1200" height="240" fill="url(#grid)"/>
  <rect width="1200" height="240" fill="url(#glow1)"/>
  <rect width="1200" height="240" fill="url(#glow2)"/>

  <circle cx="1080" cy="40" r="90" fill="#ff4ecd" opacity="0.08"/>
  <circle cx="120" cy="210" r="70" fill="#a855f7" opacity="0.08"/>
  <circle cx="1050" cy="190" r="4" fill="#ff4ecd" opacity="0.7"/>
  <circle cx="140" cy="60" r="3" fill="#a855f7" opacity="0.7"/>
  <circle cx="990" cy="90" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="210" cy="180" r="2" fill="#ffffff" opacity="0.4"/>

  <text x="600" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="4" fill="#ff4ecd" filter="url(#blur)" opacity="0.8">MARCOS FERRÁNDIZ</text>
  <text x="600" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="4" fill="#ffffff">MARCOS FERRÁNDIZ</text>
  <text x="600" y="158" text-anchor="middle" font-family="Fira Code, ui-monospace, Menlo, monospace" font-size="18" fill="#ff4ecd" letter-spacing="3">DEV JR. · DAM + IA &amp; BIG DATA</text>
  <text x="600" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#a89bb8" letter-spacing="2">20 AÑOS · CREATIVO · IA COMO COPILOTO</text>

  <rect x="0" y="236" width="1200" height="4" fill="url(#line)"/>
</svg>
